<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fly High</title>
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>
    <div class="main">
        <h1 id="title">Survey</h1>
        <p id="description">Below you can fill out the survey about your preferences</p>
        <form id="survey-form">
            <div class="form_input">
                <label id="name-label">Name
                    <input type="text" id="name" placeholder="Enter your name" required>
                </label>
            </div>
            <div class="form_input">
                <label id="email-label">Email
                    <input type="email" id="email" placeholder="Enter your email" required>
                </label>
            </div>
            <div class="form_input">
                <label id="number-label">Age
                    <input type="number" id="number" placeholder="Enter your age" min="1" max="100">
                </label>
            </div>
            
            <div class="form_input">
                <label>Gender
                    <select name="role" id="dropdown">
                        <option disabled selected>--Select an option--</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="non-binary">Non-binary</option>
                        <option value="not-say">I'd rather not say</option>
                        <option value="other">Other</option>
                    </select>
                </label>
            </div>

            <div class="checkbox-group">
                <p>What literary genres are you interested in?</p>
                <label>
                    <input class="checkbox-input" type="checkbox" name="genre" value="fiction"> Fiction
                </label>
                <label>
                    <input type="checkbox" class="checkbox-input" name="genre" value="non-fiction"> Non-Fiction
                </label>
                <label>
                    <input type="checkbox" class="checkbox-input" name="genre" value="poetry"> Poetry
                </label>
                <label>
                    <input type="checkbox" class="checkbox-input" name="genre" value="fantasy"> Fantasy
                </label>
                <label>
                    <input type="checkbox" class="checkbox-input" name="genre" value="mystery"> Mystery
                </label>
                <label>
                    <input type="checkbox" class="checkbox-input" name="genre" value="romance"> Romance
                </label>
                <label>
                    <input type="checkbox" class="checkbox-input" name="genre" value="historical"> Historical
                </label>
                <label>
                    <input type="checkbox" class="checkbox-input" name="genre" value="self-help"> Self-Help
                </label>
            </div>

            <div class="bullet-group">
                <p>How many hours a week do you read?</p>
                <label>
                    <input type="radio" class="bullet-input" value="2h-5h" name="hours"> 2h-5h
                </label>
                <label>
                    <input type="radio" class="bullet-input" value="5h-10h" name="hours"> 5h-10h
                </label>
                <label >
                    <input type="radio" class="bullet-input" value="10h-15h" name="hours"> 10h-15h
                </label>
                <label>
                    <input type="radio" class="bullet-input" value="15h+" name="hours"> 15h+
                </label>
            </div>

            <div class="form_input">
                <label for="recommendation-area">
                    Additional recommendations or questions (Optional)
                </label>
                <textarea name="recommendations" id="recommendation-area" placeholder="Please write your recommendations, requests, questions, etc."></textarea>
            </div>




            <input type="submit" id="submit" value="Submit">
            
        </form>
    </div>
</body>
</html>
